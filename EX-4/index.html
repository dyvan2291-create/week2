<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card</title>

    <link rel="stylesheet" href="style.css">
   
</head>

<body>

    <div class="card">
        <img class="card-img" src="profileImg.jpg" alt="Profile picture of Sokha Chan">

        <h1 class="card-name">Sokha Chan</h1>

        
        <p style="margin: 0 0 8px; font-size: 0.9rem; color: #95a5a6;">📍 Phnom Penh, Cambodia</p>

        <span class="role">Web Developer</span>

        <p class="card-bio">
            Student developer who loves turning ideas into clean, responsive
            websites. Currently learning HTML, CSS and JavaScript, one project at a time.
        </p>

        <button class="card-btn">Contact Me</button>
    </div>

</body>

</html>
